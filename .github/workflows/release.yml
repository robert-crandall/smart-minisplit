name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Update version in manifest
        run: |
          python scripts/update_version.py ${{ github.event.release.tag_name }}

      - name: Create release archive
        run: |
          cd custom_components
          zip -r ../smart_thermostat_controller.zip smart_thermostat_controller/

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./smart_thermostat_controller.zip
          asset_name: smart_thermostat_controller.zip
          asset_content_type: application/zip